services:
  postgres:
    image: postgres:16-alpine
    container_name: mm-eventos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mm_eventos}
      POSTGRES_USER: ${POSTGRES_USER:-mm_eventos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mm_eventos_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - mm_eventos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mm_eventos} -d ${POSTGRES_DB:-mm_eventos}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    profiles: ["full"]
    build:
      context: ./backend
    container_name: mm-eventos-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mm_eventos}
      DB_USER: ${POSTGRES_USER:-mm_eventos}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mm_eventos_dev}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081/api}
    container_name: mm-eventos-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  mm_eventos_pgdata:
