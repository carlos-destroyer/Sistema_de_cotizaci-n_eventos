spring:
  application:
    name: mm-eventos-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/mm_eventos}
    username: ${DB_USER:mm_eventos}
    password: ${DB_PASSWORD:mm_eventos_dev}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: America/Lima
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8081}
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  seed:
    enabled: ${SEED_ENABLED:true}
  igv:
    porcentaje: 18.00

logging:
  level:
    pe.mmeventos: INFO
    org.hibernate.SQL: WARN
